name: cipher_vault
description: CipherVault - cifrado y esteganografía local para Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  image: ^4.10.1
  file_picker: ^10.3.3
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  gal: ^2.3.3
  mlkem_native: ^1.0.4
  flutter_secure_storage: ^10.3.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true